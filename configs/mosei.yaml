# SCBC on CMU-MOSEI: hyperparameters of every fixed-missing subset.
# binary: Acc2 / F1 model (neutral segments dropped); seven: Acc7 model.
data: data/mosei/CMUMOSEI_new.pkl
seed: 42

subsets:
