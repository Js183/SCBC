    l:
      train:
        epochs: 60
        batch_size: 4096
        lr: 0.001
        weight_decay: 1.0e-05
        grad_clip: 5.0
      model:
        hidden_dim: 128
        tokens_per_modality: 4
        encoder_layers: 2
        attention_heads: 8
        ffn_dim: 256
        encoder_dropout: 0.1
